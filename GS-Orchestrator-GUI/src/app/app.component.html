<div class="container">
  <!-- Header -->
  <header>
    <div>
      <h1>GS-Orchestrator Control Center</h1>
      <div class="installer-links" style="margin-top: 5px; display: flex; align-items: center; gap: 10px;">
        <span style="color: var(--text-muted, #94a3b8);">Client Installers: </span>
        <a href="http://localhost:9000/install.sh" target="_blank" class="btn" style="background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; text-decoration: none; padding: 4px 10px; font-size: 0.85rem;">curl install.sh</a>
        <a href="http://localhost:9000/install.js" target="_blank" class="btn" style="background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; text-decoration: none; padding: 4px 10px; font-size: 0.85rem;">curl install.js</a>
      </div>
    </div>
    <div>
      <span data-testid="system-health-badge" class="badge" [ngClass]="{'badge-healthy': healthStatus.toLowerCase().includes('healthy') || healthStatus.toLowerCase().includes('ok'), 'badge-degraded': !healthStatus.toLowerCase().includes('healthy') && !healthStatus.toLowerCase().includes('ok')}">
        Status: {{ healthStatus }}
      </span>
    </div>
  </header>

  <!-- Navigation -->
  <app-navbar></app-navbar>

  <!-- Pages -->
  <app-home-page></app-home-page>
  <app-projects-page></app-projects-page>
  <app-register-project></app-register-project>
  <app-unregistered-servers></app-unregistered-servers>
  <app-health-simulator></app-health-simulator>
</div>
