<div *ngIf="isOpen" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🔐 Login Required</h2>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          class="form-control"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter username"
          [disabled]="loading"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="password">Password (optional for Thor)</label>
        <input
          type="password"
          id="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter password (optional)"
          [disabled]="loading"
        />
      </div>

      <div *ngIf="errorMessage" class="error-message">
        ⚠️ {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-full"
        [disabled]="loading"
      >
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div class="separator">
      <span>OR</span>
    </div>

    <button
      type="button"
      class="btn btn-superadmin btn-full"
      (click)="loginAsThor()"
      [disabled]="loading"
    >
      ⚡ Thor Superadmin Login
    </button>

    <div class="login-info">
      <p><strong>⚡ Thor Superadmin:</strong></p>
      <ul>
        <li>No password required</li>
        <li>Localhost only (127.0.0.1)</li>
        <li>Full administrative access</li>
      </ul>
    </div>
  </div>
</div>
