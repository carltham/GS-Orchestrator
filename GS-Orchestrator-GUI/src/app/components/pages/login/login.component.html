<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>🔐 GS-Orchestrator Login</h1>
      <p>Secure Access Control</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          class="form-control"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter username"
          [disabled]="loading"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password (optional for Thor)</label>
        <input
          type="password"
          id="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter password (optional)"
          [disabled]="loading"
        />
      </div>

      <div *ngIf="errorMessage" class="error-message">
        ⚠️ {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-full"
        [disabled]="loading"
      >
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div class="separator">
      <span>OR</span>
    </div>

    <button
      type="button"
      class="btn btn-superadmin btn-full"
      (click)="loginAsThor()"
      [disabled]="loading"
    >
      ⚡ Thor Superadmin Login
    </button>

    <div class="login-info">
      <p><strong>🔑 Thor Superadmin:</strong></p>
      <p>• No password required</p>
      <p>• Localhost only (127.0.0.1)</p>
      <p>• Full administrative access</p>
    </div>
  </div>
</div>
